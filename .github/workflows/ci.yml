name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Webview build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build -p lotion-app --locked
      - name: Perf harness smoke (lotion-perf)
        run: cargo run -p lotion-perf --release --locked -- --smoke
      - name: Backup produced on Windows (cross-OS round-trip, T0-R8)
        if: runner.os == 'Windows'
        run: cargo run -p lotion-perf --release --locked -- --backup-smoke DataBackup.lotion
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-windows
          path: |
            DataBackup.lotion
            DataBackup.lotion.dump-sha256
          retention-days: 3
      - name: Tauri launch smoke (Linux)
        if: runner.os == 'Linux'
        env:
          LOTION_SMOKE: '1'
        run: |
          timeout 90 dbus-run-session -- xvfb-run --auto-servernum target/debug/lotion-app | tee tauri-smoke.log
          grep -q 'LOTION_SMOKE ready db=ok' tauri-smoke.log
      - name: Tauri launch smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LOTION_SMOKE: '1'
        run: |
          $p = Start-Process target\debug\lotion-app.exe -NoNewWindow -PassThru -RedirectStandardOutput tauri-smoke.log
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'lotion-app did not quit' }
          Get-Content tauri-smoke.log
          if (-not (Select-String -Quiet 'LOTION_SMOKE ready db=ok' tauri-smoke.log)) { throw 'smoke failed' }

  backup-roundtrip:
    name: backup round-trip (Windows -> Ubuntu)
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: backup-windows
      - name: Restore on Ubuntu and compare canonical dump
        run: cargo run -p lotion-perf --release --locked -- --restore-check DataBackup.lotion

  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check-ids
      - name: Perf harness smoke (T0-07)
        run: pnpm perf --smoke
      - run: pnpm build
      - name: Fetch Electron binary
        run: node -e "require('electron')"
      - name: Allow Chromium sandbox (Ubuntu 24.04 AppArmor)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Launch smoke (Linux)
        if: runner.os == 'Linux'
        env:
          LOTION_SMOKE: '1'
          ELECTRON_ENABLE_LOGGING: '1'
        run: |
          start=$(date +%s)
          timeout 60 dbus-run-session -- xvfb-run --auto-servernum "$(node -p "require('electron')")" out/main/main.cjs | tee smoke.log
          echo "quit after $(( $(date +%s) - start ))s"
          grep -q 'LOTION_SMOKE ready db=ok' smoke.log
          if pgrep -f out/main/main.cjs; then echo 'electron left running'; exit 1; fi
      - name: E2E (Linux, virtual display)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum pnpm e2e
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
