name: Package

# T0-05: build installers, install them on clean runners, launch the installed app
# (it must reach the DB process), then uninstall.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Install, launch, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter 'Lotion-Setup-*.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Lotion'
          if (-not (Test-Path "$dir\Lotion.exe")) { throw "not installed at $dir" }
          $env:LOTION_SMOKE = '1'
          $env:LOTION_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process "$dir\Lotion.exe" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'installed app did not quit within 60 s' }
          Get-Content $env:LOTION_SMOKE_OUT
          if ($p.ExitCode -ne 0) { throw "smoke exit code $($p.ExitCode)" }
          Start-Process "$dir\Uninstall Lotion.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\Lotion.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\Lotion.exe") { throw 'uninstall left Lotion.exe behind' }
          'install → launch → uninstall OK'

      - name: Install, launch, uninstall (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/lotion_*_amd64.deb
          test -x /opt/Lotion/lotion
          LOTION_SMOKE=1 LOTION_SMOKE_OUT="$RUNNER_TEMP/smoke.txt" timeout 60 \
            dbus-run-session -- xvfb-run --auto-servernum /opt/Lotion/lotion
          cat "$RUNNER_TEMP/smoke.txt"
          grep -q 'db=ok' "$RUNNER_TEMP/smoke.txt"
          sudo apt-get remove -y lotion
          test ! -e /opt/Lotion/lotion
          echo 'install → launch → uninstall OK'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.deb
          retention-days: 14
          if-no-files-found: error

  # T0-R5: the same install → launch → uninstall check for the Tauri app (ADR-019).
  package-tauri:
    name: package-tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Webview build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - run: pnpm install --frozen-lockfile
      - name: Build installers (Tauri bundler)
        working-directory: crates/lotion-app
        run: pnpm tauri build --ci

      - name: Install, launch, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target\release\bundle\nsis -Filter '*-setup.exe' | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $dir = Join-Path $env:LOCALAPPDATA 'Lotion'
          if (-not (Test-Path "$dir\lotion.exe")) { Get-ChildItem $env:LOCALAPPDATA; throw "not installed at $dir" }
          $env:LOTION_SMOKE = '1'
          $env:LOTION_SMOKE_OUT = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $p = Start-Process "$dir\lotion.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'installed app did not quit within 90 s' }
          Get-Content $env:LOTION_SMOKE_OUT
          if (-not (Select-String -Quiet 'db=ok' $env:LOTION_SMOKE_OUT)) { throw 'smoke failed' }
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\lotion.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\lotion.exe") { throw 'uninstall left lotion.exe behind' }
          'install → launch → uninstall OK'

      - name: Install, launch, uninstall (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          test -x /usr/bin/lotion
          LOTION_SMOKE=1 LOTION_SMOKE_OUT="$RUNNER_TEMP/smoke.txt" timeout 90 \
            dbus-run-session -- xvfb-run --auto-servernum /usr/bin/lotion
          cat "$RUNNER_TEMP/smoke.txt"
          grep -q 'db=ok' "$RUNNER_TEMP/smoke.txt"
          sudo apt-get remove -y lotion
          test ! -e /usr/bin/lotion
          echo 'install → launch → uninstall OK'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tauri-installers-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
          retention-days: 14
          if-no-files-found: error
