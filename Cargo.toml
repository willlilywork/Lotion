[workspace]
resolver = "3"
members = ["crates/lotion-core", "crates/lotion-app", "crates/lotion-perf"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
