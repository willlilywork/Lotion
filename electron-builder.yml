# Packaging (T0-05). Unsigned for now: signing needs certificates (see ADR-017).
appId: com.willlily.lotion
productName: Lotion
copyright: Copyright © 2026 Will Lily
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - '!out/**/*.map'
  - package.json
asar: true
asarUnpack:
  - '**/*.node'
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Lotion-Setup-${version}.${ext}
linux:
  target:
    - target: deb
      arch: [x64]
  category: Office
  maintainer: Will Lily <353627199+willlilywork@users.noreply.github.com>
  synopsis: Local-first workspace with advanced databases
deb:
  artifactName: lotion_${version}_amd64.${ext}
